<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAIN: Import Split</title>
  <meta property="og:title" content="TRAIN: Import Split">
  <meta property="og:site_name" content="TRAIN: Workout App">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/webp" href="/Logo_Orange.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #17171a 0%, #121215 60%, #0e0e11 100%);
      color: #fffbf8;
      font-family: 'Afacad', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      justify-items: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
    }
    .spinner-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }
    .bottom-badge-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .powered-by-logo {
      width: 33.333%;
      max-width: 140px;
      min-width: 110px;
      height: auto;
      object-fit: contain;
      opacity: 0.92;
    }
    .text-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      color: #fffbf8;
    }
    p {
      font-size: 16px;
      font-weight: 500;
      color: #8a8a90;
      line-height: 1.4;
    }
    /* Simple 8-line spinner using orange gradient colors */
    .spinner {
      position: relative;
      width: 50px;
      height: 50px;
      margin: 8px 0;
    }
    .spinner div {
      position: absolute;
      width: 4px;
      height: 14px;
      background: linear-gradient(to bottom, #f98d20, #ff6b34);
      border-radius: 2px;
      left: 23px;
      top: 0;
      transform-origin: 2px 25px;
      animation: spinner-fade 0.8s linear infinite;
    }
    .spinner div:nth-child(1) { transform: rotate(0deg); animation-delay: -0.7s; }
    .spinner div:nth-child(2) { transform: rotate(45deg); animation-delay: -0.6s; }
    .spinner div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.5s; }
    .spinner div:nth-child(4) { transform: rotate(135deg); animation-delay: -0.4s; }
    .spinner div:nth-child(5) { transform: rotate(180deg); animation-delay: -0.3s; }
    .spinner div:nth-child(6) { transform: rotate(225deg); animation-delay: -0.2s; }
    .spinner div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
    .spinner div:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }

    @keyframes spinner-fade {
      0% { opacity: 1; }
      100% { opacity: 0.15; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 28px;
      border-radius: 24px;
      background: #2a2a2e;
      color: #fffbf8;
      font-family: 'Afacad', sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: -1px -1px 3px rgba(255, 255, 255, 0.06), 1px 1px 3px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
      border: none;
      outline: none;
      opacity: 0;
      transform: translateY(10px);
      animation: show-btn 0.5s forwards ease;
      animation-delay: 1.5s;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.95);
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.55), inset -1px -1px 3px rgba(255, 255, 255, 0.07);
    }
    @keyframes show-btn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="spinner-container">
    <div class="spinner">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <div class="container">
    <div class="text-container">
      <h1 id="title">Opening TRAIN App...</h1>
      <p id="subtitle">Preparing your workout split import</p>
    </div>

    <a id="fallback-btn" href="#" class="btn">Tap if app did not open</a>
  </div>

  <div class="bottom-badge-container">
    <img src="/orange-share-watermark.webp" alt="Powered by TRAIN" class="powered-by-logo">
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || '';
    const name = params.get('name');
    const urlLang = params.get('lang');

    const browserLang = (navigator.languages && navigator.languages.length > 0
      ? navigator.languages[0]
      : (navigator.language || navigator.userLanguage || '')
    ).toLowerCase();

    const isSpanish = urlLang ? (urlLang.toLowerCase() === 'es') : browserLang.startsWith('es');
    const isExercise = id.startsWith('EXE-') || window.location.pathname.includes('/exercise');
    const isSplitDay = id.startsWith('SLD-') || window.location.pathname.includes('/day');

    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const fallbackBtnEl = document.getElementById('fallback-btn');

    if (isSpanish) {
      document.title = isExercise
        ? 'TRAIN: Importar ejercicio'
        : isSplitDay
        ? 'TRAIN: Importar día de split'
        : 'TRAIN: Importar rutina';
      if (name) {
        titleEl.innerHTML = "Importando:<br>'" + escapeHtml(decodeURIComponent(name)) + "'<br>en TRAIN...";
      } else {
        titleEl.textContent = "Abriendo la aplicación TRAIN...";
      }
      subtitleEl.textContent = isExercise
        ? "Preparando la importación de tu ejercicio"
        : isSplitDay
        ? "Preparando la importación de tu día de entrenamiento"
        : "Preparando la importación de tu rutina";
      fallbackBtnEl.textContent = "Toca si la aplicación no se abrió";
    } else {
      document.title = isExercise
        ? 'TRAIN: Import Exercise'
        : isSplitDay
        ? 'TRAIN: Import Split Day'
        : 'TRAIN: Import Split';
      if (name) {
        titleEl.innerHTML = "Importing:<br>'" + escapeHtml(decodeURIComponent(name)) + "'<br>into TRAIN...";
      } else {
        titleEl.textContent = "Opening TRAIN App...";
      }
      subtitleEl.textContent = isExercise
        ? "Preparing your custom exercise import"
        : isSplitDay
        ? "Preparing your workout split day import"
        : "Preparing your workout split import";
      fallbackBtnEl.textContent = "Tap if app did not open";
    }

    const isPreview = params.get('preview') === 'true' || params.has('preview') || params.has('noredirect');
    const deepLinkUrl = "com.iamchriskjr.trainworkoutapp://import-split?id=" + encodeURIComponent(id);
    const fallbackUrl = "https://link.trainworkoutapp.com/bZpd/split_share";

    fallbackBtnEl.href = deepLinkUrl;

    if (!isPreview) {
      if (id) {
        window.location.href = deepLinkUrl;
      }
      setTimeout(function() {
        if (document.visibilityState === 'visible') {
          window.location.href = fallbackUrl;
        }
      }, 2000);
    } else {
      console.log('Preview mode active: automatic deep link and store redirection disabled.');
    }
  </script>
</body>
</html>
